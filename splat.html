        async function compressData(string) {
            if (!window.CompressionStream) {
                console.warn('CompressionStream API not supported. Skipping compression.');
                return string;
            }
            try {
                const stream = new Blob([string], { type: 'text/plain' })
                    .stream()
                    .pipeThrough(new CompressionStream('gzip'));
                const compressedResponse = new Response(stream);
                const buffer = await compressedResponse.arrayBuffer();
                // Convert buffer to a string that can be stored in localStorage. btoa is a good option.
                return btoa(String.fromCharCode(...new Uint8Array(buffer)));
            } catch (error) {
                console.error('Compression failed:', error);
                return string; // Fallback to uncompressed
            }
        }

        async function decompressData(data) {
            if (!window.DecompressionStream) {
                console.warn('DecompressionStream API not supported. Assuming uncompressed data.');
                return data;
            }
            try {
                const binaryString = atob(data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const stream = new Blob([bytes])
                    .stream()
                    .pipeThrough(new DecompressionStream('gzip'));
                const decompressedResponse = new Response(stream);
                return await decompressedResponse.text();
            } catch (error) {
                console.error('Decompression failed, maybe data is not compressed:', error);
                return data; // Fallback to assuming it's not compressed
            }
        }

                    x: parseInt(n.x ?? document.getElementById(n.id)?.style.left ?? '0'),

            };

            try {
                const compressedData = await compressData(JSON.stringify(boardData));
                localStorage.setItem('splatAutosave', compressedData);
                console.log(`Board auto-saved at ${new Date().toLocaleTimeString()}`);
            } catch (error) {
                console.error('Auto-save failed:', error);
            }
        }

        async function autoLoadBoard() {
            const savedData = localStorage.getItem('splatAutosave');

                    const boardData = JSON.parse(decompressedData);

            }

        // Simple keyword matching (not BM25)
        function keywordMatch(query, text) {
            const queryLower = query.toLowerCase();
            const textLower = text.toLowerCase();
            // Check if all words in query are present in text
            const queryWords = queryLower.split(/\s+/).filter(w => w.length > 0);
            return queryWords.every(word => textLower.includes(word));
        }

        // Tool execution functions
        async function executeTool(toolName, toolArguments) {
            switch (toolName) {
                case "semantic_search":
                    const { query } = toolArguments;
                    // Get k and threshold from UI (same defaults as user sees: k=5, threshold=0.5)
                    await performHybridSearch(query);
                    const highlighted = Array.from(document.querySelectorAll('.note.search-highlight'))
                        .map(note => {
                            const noteData = notes.find(n => n.id === note.id);
                            return {
                                id: note.id,
                                text: noteData ? noteData.text : note.textContent,
                                color: noteData ? noteData.color : null
                            };
                        });
                    return {
                        success: true,
                        results: highlighted,
                        count: highlighted.length
                    };

                case "keyword_search":
                    const { query: keywordQuery } = toolArguments;
                    const matchingNotes = notes.filter(note => keywordMatch(keywordQuery, note.text));
                    return {
                        success: true,
                        results: matchingNotes.map(n => ({
                            id: n.id,
                            text: n.text,
                            color: n.color
                        })),
                        count: matchingNotes.length
                    };

                case "get_notes":
                    const { ids } = toolArguments;
                    const foundNotes = ids.map(id => notes.find(n => n.id === id)).filter(n => n !== undefined);
                    return {
                        success: true,
                        notes: foundNotes.map(n => ({
                            id: n.id,
                            text: n.text,
                            color: n.color,
                            pinned: n.pinned,
                            position: { x: n.x, y: n.y }
                        })),
                        count: foundNotes.length
                    };

                case "get_selected":
                    const selectedNoteIds = Array.from(selectedNotes);
                    const selectedNoteData = selectedNoteIds
                        .map(id => notes.find(n => n.id === id))
                        .filter(n => n !== undefined);
                    return {
                        success: true,
                        notes: selectedNoteData.map(n => ({
                            id: n.id,
                            text: n.text,
                            color: n.color,
                            pinned: n.pinned,
                            position: { x: n.x, y: n.y }
                        })),
                        count: selectedNoteData.length
                    };

                case "get_last_focused":
                    if (lastFocusedNoteId) {
                        const lastNote = notes.find(n => n.id === lastFocusedNoteId);
                        if (lastNote) {
                            return {
                                success: true,
                                note_id: lastFocusedNoteId,
                                note: {
                                    id: lastNote.id,
                                    text: lastNote.text,
                                    color: lastNote.color,
                                    pinned: lastNote.pinned,
                                    position: { x: lastNote.x, y: lastNote.y }
                                }
                            };
                        }
                    }
                    return {
                        success: false,
                        message: "No note has been focused yet"
                    };

                case "get_all_notes_of_color":
                    try {
                        const { color } = toolArguments;
                        if (!color) {
                            return {
                                success: false,
                                error: "Color parameter is required"
                            };
                        }
                        
                        // Normalize color to lowercase for comparison
                        const normalizedColor = color.toLowerCase().trim();
                        if (!AVAILABLE_COLORS.includes(normalizedColor)) {
                            return {
                                success: false,
                                error: `Invalid color "${color}". Must be one of: ${AVAILABLE_COLORS.join(', ')}`
                            };
                        }
                        
                        // Ensure notes array is valid
                        if (!Array.isArray(notes)) {
                            return {
                                success: false,
                                error: "Notes array is not initialized"
                            };
                        }
                        
                        // Filter notes with proper null checks and case-insensitive color comparison
                        const colorNotes = notes.filter(n => {
                            if (!n || typeof n !== 'object') return false;
                            const noteColor = (n.color || '').toLowerCase().trim();
                            return noteColor === normalizedColor;
                        });
                        
                        return {
                            success: true,
                            notes: colorNotes.map(n => {
                                try {
                                    return {
                                        id: n.id || 'unknown',
                                        text: n.text || '',
                                        color: n.color || 'unknown',
                                        pinned: Boolean(n.pinned),
                                        position: { 
                                            x: (typeof n.x === 'number') ? n.x : 0, 
                                            y: (typeof n.y === 'number') ? n.y : 0 
                                        }
                                    };
                                } catch (mapError) {
                                    console.error('Error mapping note:', mapError, n);
                                    return {
                                        id: 'error',
                                        text: 'Error reading note',
                                        color: 'unknown',
                                        pinned: false,
                                        position: { x: 0, y: 0 }
                                    };
                                }
                            }),
                            count: colorNotes.length
                        };
                    } catch (error) {
                        console.error('Error in get_all_notes_of_color:', error, toolArguments);
                        return {
                            success: false,
                            error: `Error getting notes of color: ${error.message}`
                        };

                case "add":

                    if (!AVAILABLE_COLORS.includes(noteColor)) {
                        return {
                            success: false,
                            error: `Invalid color. Must be one of: ${AVAILABLE_COLORS.join(', ')}`
                        };
                    }

                    // Handle edge cases for malformatted args
                    if (noteText === undefined) {
                        noteText = "";
                    }
                    if (!notePosition) {
                        // Get a default position near center of viewport
                        const canvas = document.getElementById('canvas');
                        notePosition = [
                            canvas.scrollLeft + (canvas.clientWidth / 2) / zoomLevel - 50,
                            canvas.scrollTop + (canvas.clientHeight / 2) / zoomLevel - 25
                        ];
                    }
                    
                    // Split text by newlines to create multiple notes if needed
                    const textLines = noteText.split('\n').filter(line => line.trim() !== '');
                    const newNoteIds = [];
                    const canvasInner = document.getElementById('canvasInner');
                    
                    textLines.forEach((line, index) => {
                        // Create new note. This also computes embedding.
                        const note = createNote(line.trim(), null, noteColor, false);
                        // Position notes with slight offset for multiple notes
                        note.style.left = (notePosition[0] + index * 20) + 'px';
                        note.style.top = (notePosition[1] + index * 20) + 'px';
                        canvasInner.appendChild(note);
                        
                        // Update note data
                        const noteData = notes.find(n => n.id === note.id);
                        if (noteData) {
                            noteData.x = parseInt(note.style.left);
                            noteData.y = parseInt(note.style.top);
                            noteData.textChanged = true; // Mark for embedding computation
                        }
                        newNoteIds.push(note.id);

                        // Highlight the note to indicate it was added
                        // Add a temporary highlight effect
                        note.classList.add('focused');

                        // Remove the highlight after the animation completes
                        setTimeout(() => {
                            note.classList.remove('focused');
                        }, 500);
                    });
                    
                    return {
                        success: true,
                        ids: newNoteIds,
                        count: newNoteIds.length
                    };

                case "edit":
                    const { id: editId, new_content } = toolArguments;
                    const editNote = document.getElementById(editId);
                    if (editNote) {
                        editNote.textContent = new_content;
                        const editNoteData = notes.find(n => n.id === editId);
                        if (editNoteData) {
                            const textChanged = editNoteData.text !== new_content;
                            editNoteData.text = new_content;
                            // Mark as changed so embedding will be recomputed
                            if (textChanged) {
                                editNoteData.textChanged = true;
                                editNoteData.embedding = null; // Clear old embedding
                                // Compute new embedding
                                computeEmbeddingForNote(editNoteData).catch(err => {
                                    console.error(`Error updating embedding for note ${editId}:`, err);
                                });
                            }
                            // Update last focused
                            lastFocusedNoteId = editId;
                        }
                        return {
                            success: true,
                            message: `Note ${editId} updated`
                        };
                    }
                    return {
                        success: false,
                        error: `Note ${editId} not found`
                    };

                case "remove":
                    const { ids: removeIds } = toolArguments;
                    // First, highlight the notes to be removed
                    clearSearchHighlights();
                    const notesToRemove = [];
                    removeIds.forEach(id => {
                        const note = document.getElementById(id);
                        if (note) {
                            note.classList.add('search-highlight');
                            // Bring to front
                            const parent = note.parentNode;
                            parent.removeChild(note);
                            parent.appendChild(note);
                            notesToRemove.push(id);
                        }
                    });
                    
                    // Ask for confirmation
                    const confirmed = window.confirm(`Remove ${notesToRemove.length} note(s)?`);
                    if (confirmed) {
                        notesToRemove.forEach(id => {
                            const note = document.getElementById(id);
                            if (note) {
                                note.remove();
                                notes = notes.filter(n => n.id !== id);
                                // Embedding is part of note object, so it's automatically removed
                            }
                        });
                        clearSearchHighlights();
                        updateStatus(`${notesToRemove.length} note(s) removed`);
                        return {
                            success: true,
                            removed: notesToRemove,
                            count: notesToRemove.length
                        };
                    } else {
                        // Clear highlights if cancelled
                        clearSearchHighlights();
                        return {
                            success: false,
                            message: "Removal cancelled by user"
                        };
                    }

                case "set_color":
                    const { id: colorId, color: newColor } = toolArguments;
                    if (!AVAILABLE_COLORS.includes(newColor)) {
                        return {
                            success: false,
                            error: `Invalid color. Must be one of: ${AVAILABLE_COLORS.join(', ')}`
                        };
                    }
                    const colorNote = document.getElementById(colorId);
                    if (colorNote) {
                        // Remove existing color classes
                        colorNote.classList.remove(...colorNote.className.split(' ').filter(c => c.startsWith('color-')));
                        colorNote.classList.add(`color-${newColor}`);
                        const colorNoteData = notes.find(n => n.id === colorId);
                        if (colorNoteData) {
                            colorNoteData.color = newColor;
                        }
                        return {
                            success: true,
                            message: `Note ${colorId} color set to ${newColor}`
                        };
                    }
                    return {
                        success: false,
                        error: `Note ${colorId} not found`
                    };

                case "highlight_notes":
                    const { ids: highlightIds } = toolArguments;
                    clearSearchHighlights();
                    highlightIds.forEach(id => {
                        const note = document.getElementById(id);
                        if (note) {
                            note.classList.add('search-highlight');
                            // Bring to front (z-index)
                            const parent = note.parentNode;
                            parent.removeChild(note);
                            parent.appendChild(note);
                        }
                    });
                    return {
                        success: true,
                        highlighted: highlightIds.length
                    };

                default:
                    return { success: false, error: `Unknown tool: ${toolName}` };
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            // Add user message to chat
            addChatMessage('user', message);
            input.value = '';
            input.disabled = true;

            // Show thinking indicator
            const thinkingMessageId = 'thinking-' + Date.now();
            addChatMessage('assistant', '...', 'thinking', thinkingMessageId);

            try {
                // Add user message to history
                chatHistory.push({ role: 'user', content: message });

                // Call OpenAI with tools
                const systemMessage = {
                    role: 'system',
                    content: 'You are a helpful assistant for an affinity diagramming tool. You can help users search, analyze, and organize their notes. Use the available tools to interact with the board.'
                };

                // Build messages array with system message
                const messages = [systemMessage, ...chatHistory];
                
                // Loop until we get a final response without tool calls
                let maxIterations = 10; // Prevent infinite loops
                let iteration = 0;
                let thinkingMessageRemoved = false;

                const removeThinkingMessage = () => {
                    if (!thinkingMessageRemoved) {
                        const thinkingEl = document.getElementById(thinkingMessageId);
                        if (thinkingEl) thinkingEl.remove();
                        thinkingMessageRemoved = true;
                    }
                };
                
                while (iteration < maxIterations) {
                    iteration++;
                    
                    let response;
                    if (currentSettings.llm.provider === 'ollama') {
                        try {
                            response = await chatCompletionOllama(messages, availableTools);
                        } catch (error) {
                            removeThinkingMessage();
                            addChatMessage('assistant', `Error calling Ollama: ${error.message}`);
                            return;
                        }
                    } else if (currentSettings.llm.provider === 'openai') {
                        try {
                            response = await chatCompletionOpenAI(messages, availableTools, 'auto');
                        } catch (error) {
                            removeThinkingMessage();
                            addChatMessage('assistant', `Error calling OpenAI: ${error.message}`);
                            return;
                        }
                    } else {
                        removeThinkingMessage();
                        addChatMessage('assistant', `Error: LLM provider not configured or supported.`);
                        return;
                    }

                    const assistantMessage = response.choices[0].message;
                    console.log(assistantMessage);

                    // Try to detect if this is tool call in disguise
                    if (assistantMessage.content && !assistantMessage.tool_calls) {
                        try {
                            isRawToolCall = JSON.parse(assistantMessage.content);
                            if (isRawToolCall.type === "function") {
                                // This is a tool call. Wrap it accordingly, and remove the content.
                                assistantMessage.tool_calls = [{
                                    id: `call_${Math.random().toString(36).substr(2, 9)}`,
                                    type: "function",
                                    function: isRawToolCall.function
                                }];
                                delete assistantMessage.content;
                                console.log('Detected raw tool call in assistant reply, converted to tool_calls.');
                            }
                        } catch (parseError) {
                            if (assistantMessage.content.trim().startsWith('{"type"')) {
                                console.warn('Assistant reply is a tool call, but malformed JSON:', parseError);
                                assistantMessage.content = "[Could not parse tool call JSON: Malformed JSON] Full JSON: " + assistantMessage.content;
                            }
                            // Normal assistant text, not a tool call
                        }
                    }
                    
                    // Add assistant message to messages array (not chatHistory yet)
                    messages.push(assistantMessage);

                    // Handle tool calls
                    if (assistantMessage.tool_calls && assistantMessage.tool_calls.length > 0) {
                        removeThinkingMessage();
                        // Show tool usage
                        if (iteration === 1) {
                            const toolNames = assistantMessage.tool_calls.map(tc => tc.function.name).join(', ');
                            addChatMessage('tool-use', `Using tools: ${toolNames}...`);
                        }
                        
                        // Execute all tool calls
                        const toolResults = [];
                        for (const toolCall of assistantMessage.tool_calls) {
                            try {
                                const toolName = toolCall.function.name;
                                let toolArgs = toolCall.function.arguments;
                                if (typeof toolCall.function.arguments === 'string') {
                                    // Parse arguments JSON, if this field is a string. 
                                    // We check this here since Ollama and OpenAI differ in format.
                                    toolArgs = JSON.parse(toolCall.function.arguments);
                                }
                                const result = await executeTool(toolName, toolArgs);
                                toolResults.push({
                                    tool_call_id: toolCall.id,
                                    role: 'tool',
                                    name: toolName,
                                    content: JSON.stringify(result)
                                });
                            } catch (toolError) {
                                console.error(`Error executing tool ${toolCall.function.name}:`, toolError);
                                // Still add a tool result even if it failed
                                toolResults.push({
                                    tool_call_id: toolCall.id,
                                    role: 'tool',
                                    name: toolCall.function.name,
                                    content: JSON.stringify({ success: false, error: toolError.message })
                                });
                            }
                        }

                        // Add tool results immediately after assistant message with tool_calls
                        messages.push(...toolResults);
                        
                        // Continue loop to get next response
                        continue;
                    } else {
                        removeThinkingMessage();
                        // No tool calls - this is the final response
                        // Add to chatHistory for persistence
                        chatHistory.push(assistantMessage);
                        
                        if (assistantMessage.content) {
                            addChatMessage('assistant', assistantMessage.content);
                        }
                        break; // Exit loop
                    }
                }
                
                if (iteration >= maxIterations) {
                    removeThinkingMessage();
                    addChatMessage('assistant', 'Error: Maximum iterations reached. There may be an issue with tool call handling.');
                }

            } catch (error) {
                console.error('Chat error:', error);
                const thinkingEl = document.getElementById(thinkingMessageId);
                if (thinkingEl) thinkingEl.remove();
                addChatMessage('assistant', `Error: ${error.message}. Please check your OpenAI API key and network connection.`);
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        function addChatMessage(role, text, extraClass = null, id = null) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${role}`;
            if (extraClass) {
                messageDiv.classList.add(extraClass);
            }
            if (id) {
                messageDiv.id = id;
            }

            if (extraClass === 'thinking') {
                messageDiv.innerHTML = '<span>.</span><span>.</span><span>.</span>';
            } else {
                messageDiv.textContent = text;
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Ollama API handlers
        async function getEmbeddingOllama(text) {
            if (currentSettings.embedding.provider !== 'ollama') {
                throw new Error('Ollama provider is not selected in settings as embedding model.');
            }

            const ollamaUrl = currentSettings.llm.ollamaUrl || 'http://localhost:11434';
            const embeddingModel = currentSettings.embedding.model;

            if (!embeddingModel) {
                throw new Error('Ollama embedding model not set in settings.');
            }

            const response = await fetch(`${ollamaUrl}/api/embed`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: embeddingModel,
                    input: text
                })
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({ error: response.statusText }));
                throw new Error(error.error || `Ollama API error: ${response.status}`);
            }

            const data = await response.json();
            return data.embeddings[0];
        }

        async function chatCompletionOllama(messages, tools = null, toolChoice = 'auto') {
            if (currentSettings.llm.provider !== 'ollama') {
                throw new Error('Ollama provider is not selected in settings.');
            }

            const ollamaUrl = currentSettings.llm.ollamaUrl || 'http://localhost:11434';
            const model = currentSettings.llm.ollamaModel;

            if (!model) {
                throw new Error('Ollama model not set in settings.');
            }

            const body = {
                model: model,
                messages: messages,
                stream: false, // Important for tool use
            };

            if (tools) {
                body.tools = tools;
            }

            const response = await fetch(`${ollamaUrl}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({ error: response.statusText }));
                throw new Error(error.error || `Ollama API error: ${response.status}`);
            }

            const data = await response.json();
            
            // Adapt Ollama's response to look like OpenAI's for tool calling
            if (data.message && data.message.tool_calls) {
                return {
                    choices: [{
                        message: {
                            role: 'assistant',
                            content: data.message.content,
                            tool_calls: data.message.tool_calls.map(tc => ({
                                id: tc.id || `call_${Math.random().toString(36).substr(2, 9)}`, // Ollama doesn't always provide IDs
                                type: 'function',
                                function: {
                                    name: tc.function.name,
                                    arguments: tc.function.arguments
                                }
                            }))
                        }
                    }]
                };
            }

            return {
                choices: [{
                    message: {
                        role: 'assistant',
                        content: data.message.content
                    }
                }]
            };
        }
        

        // OpenAI Configuration - USER MUST SET THEIR API KEY
        // IMPORTANT: Set your OpenAI API key below. 
        // WARNING: Exposing API keys in client-side code is a security risk.
        // For production, use a backend proxy server instead.
        const OPENAI_API_BASE = 'https://api.openai.com/v1';
        
        // OpenAI API helper functions
        async function openaiRequest(endpoint, options = {}) {
            if (!currentSettings.llm.openaiApiKey) {
                throw new Error('OpenAI API key not set in settings. Please set your OpenAI API key by clicking the settings button (gear icon).');
            }
            const OPENAI_API_KEY = currentSettings.llm.openaiApiKey;
            
            const response = await fetch(`${OPENAI_API_BASE}${endpoint}`, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${OPENAI_API_KEY}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({ error: { message: response.statusText } }));
                throw new Error(error.error?.message || `API error: ${response.status}`);
            }
            
            return response.json();
        }
        
        // OpenAI embedding functions
        async function getEmbeddingOpenAI(text) {
            if (!currentSettings.embedding.provider !== 'openai')
                throw new Error('OpenAI provider is not selected in settings as embedding model: Cannot send request to OpenAI API.');

            const embeddingModel = currentSettings.embedding.model || 'text-embedding-3-small';

            const data = await openaiRequest('/embeddings', {
                method: 'POST',
                body: JSON.stringify({
                    model: 'text-embedding-3-small',
                    input: text
                })
            });
            return data.data[0].embedding;
        }
        
        async function chatCompletionOpenAI(messages, tools = null, toolChoice = 'auto') {
            if (currentSettings.llm.provider !== 'openai')
                throw new Error('OpenAI provider is not selected in settings: Cannot send request to OpenAI API.');

            const model = currentSettings.llm.openaiModel || 'gpt-4.1-mini';

            const body = {
                model: model,
                messages: messages
            };
            
            if (tools) {
                body.tools = tools;
                body.tool_choice = toolChoice;
            }
            
            const data = await openaiRequest('/chat/completions', {
                method: 'POST',
                body: JSON.stringify(body)
            });
            
            return data;
        }
    </script>
